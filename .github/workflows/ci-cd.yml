name: CI-CD with Locust Performance Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push catalog-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalog-service
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/catalog-service:latest

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/catalog.yaml
          kubectl apply -f k8s/order.yaml
          kubectl apply -f k8s/ingress.yaml

  perf-test:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust dependencies
        run: |
          pip install locust

      - name: Run Locust headless
        working-directory: tests/locust
        run: |
          locust -f locustfile.py \
            --host=http://shop.local \
            --headless \
            --users=100 \
            --spawn-rate=10 \
            --run-time=5m \
            --html=report.html
        continue-on-error: false

      - name: Upload Locust report
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: tests/locust/report.html
